<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - Dhanyalakshmi Insurancewala</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body{display:flex;justify-content:center;align-items:center;height:100vh;background:#f4f6f9;}
    .login-card{
      width: 420px;
      background: #fff;
      padding: 26px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }
    .login-card h1{font-size:22px;margin-bottom:6px;}
    .login-card p{color:#6b7280;margin-bottom:18px;font-size:13px;}
    .form-group{margin-bottom:14px;}
    label{display:block;font-size:12px;color:#6b7280;margin-bottom:6px;font-weight:600;}
    input{
      width:100%;
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      outline:none;
      font-size: 14px;
    }
    input:focus{border-color:#111827;}
    .btn-login{
      width:100%;
      margin-top: 8px;
      background:#111827;
      color:#fff;
      padding: 10px 12px;
      border:none;
      border-radius: 10px;
      cursor:pointer;
      font-weight:700;
    }
    .btn-login:hover{background:#374151;}
    .error{
      background:#fee2e2;
      color:#991b1b;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .demo{
      margin-top: 14px;
      font-size: 12px;
      color:#6b7280;
    }
    code{background:#f3f4f6;padding:2px 6px;border-radius:8px;}
  </style>
</head>
<body>

  <div class="login-card">
    <h1>Dhanyalakshmi Insurancewala Login</h1>
    <p>Use your official credentials to access the dashboard.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="admin@test.com" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required />
      </div>

      <button class="btn-login" type="submit">Login</button>
    </form>

    <div class="demo">
      Demo (from seed): <code>admin@test.com</code> / <code>1234</code>
    </div>
  </div>

</body>
</html>
